name: asset-management

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --location /data"
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azurite-data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AssetManagementDb: "Server=sqlserver,1433;Database=AssetManagement;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: http://localhost:3000
      EntraId__Instance: "https://login.microsoftonline.com/"
      EntraId__TenantId: ${ENTRA_TENANT_ID:-}
      EntraId__ClientId: ${ENTRA_API_CLIENT_ID:-}
      # App-only Graph access to search the tenant directory (docs/security/entra-id-setup.md) — reuses
      # the API's own App Registration/tenant; empty ClientSecret disables the feature safely.
      MicrosoftGraph__TenantId: ${ENTRA_TENANT_ID:-}
      MicrosoftGraph__ClientId: ${ENTRA_API_CLIENT_ID:-}
      MicrosoftGraph__ClientSecret: ${GRAPH_CLIENT_SECRET:-}
      # Optional: sends assignment notification emails via Graph's sendMail when set (needs the extra
      # Mail.Send application permission on top of User.Read.All) — empty disables email delivery.
      MicrosoftGraph__SenderMailbox: ${GRAPH_SENDER_MAILBOX:-}
      Frontend__BaseUrl: http://localhost:3000
      # Azurite's well-known local dev account key (public, documented on Microsoft Learn — identical
      # on every Azurite install, not a real secret) — only the host changes for the Docker network.
      BlobStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — see docs/security/entra-id-setup.md}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_WEB_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_WEB_CLIENT_SECRET:-}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sqlserver-data:
  azurite-data:
